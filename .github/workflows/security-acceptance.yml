# Security acceptance: restricted-role RLS + real Redis.
#
# Closes the one gap the security work cannot close locally: the populated
# PostgreSQL/RLS verification needs a real policy engine, and the owner's C:
# drive has no room for Docker. Actions runners ship Docker, so Compose runs
# there even though it cannot run on the development machine. Local Docker
# absence is a machine limitation, not evidence about CI.
#
# Written against backend commit 90eb134 (parents f589079, e8af933) and the
# contract those commits define:
#
#   infra/docker-compose.security-test.yml   images, ports, three injected secrets
#   infra/postgres/security-test-init.sh     provisioning wrapper (psql :vars)
#   apps/api/tests/conftest.py               supabase_url / security_test_redis_url
#
# Credentials are never written to the repository. Compose reads three secrets
# from the environment and its `${VAR:?}` guards refuse to start without them.
#
# A green run here is acceptance of the DATABASE isolation layer only.
# Deployment acceptance — the three-caller matrix, revocation against a
# deployed revision, and /health freshness — is a separate gate that this job
# does not and cannot cover.

name: Security Acceptance (PostgreSQL + Redis)

on:
  # Primary trigger. This provisions real services and is an acceptance gate,
  # not a per-commit check.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/**"
      - ".github/workflows/security-acceptance.yml"
      - ".github/scripts/check_security_test_contract.py"
  push:
    branches:
      - security-foundation-codex
      - frontend-ci-claude

permissions:
  contents: read

concurrency:
  # Disposable services bind fixed ports (55432/56379). Two concurrent runs on
  # the same ref would contend for them.
  group: security-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-acceptance:
    runs-on: ubuntu-latest

    env:
      # Uniquely names this job's Compose project, so `down -v` can only ever
      # remove containers, networks and volumes this run created. Without it the
      # project name defaults to the directory ("infra") and would be shared by
      # any other run on the same host.
      COMPOSE_PROJECT_NAME: security-acceptance-${{ github.run_id }}-${{ github.run_attempt }}

      # Injected, never committed. Compose's `${VAR:?...}` rejects both unset
      # and empty values (the colon form tests for null too), so it is the
      # enforcing guard; the preflight simply fails earlier and names the
      # variable rather than leaving a container exiting during init.
      SECURITY_TEST_BOOTSTRAP_PASSWORD: ${{ secrets.SECURITY_TEST_BOOTSTRAP_PASSWORD }}
      SECURITY_TEST_OWNER_PASSWORD: ${{ secrets.SECURITY_TEST_OWNER_PASSWORD }}
      SECURITY_TEST_RUNTIME_PASSWORD: ${{ secrets.SECURITY_TEST_RUNTIME_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the production image and pyproject's requires-python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Secret values are never interpolated into shell source. They arrive as
      # environment variables (set once at job level from the secret store) and
      # every reference below is a quoted "$VAR" passed as a printf argument,
      # so a password containing quotes, $ or backticks cannot be re-parsed.
      - name: Compose disposable service URLs
        run: |
          {
            printf '::add-mask::%s\n' "$SECURITY_TEST_OWNER_PASSWORD"
            printf '::add-mask::%s\n' "$SECURITY_TEST_RUNTIME_PASSWORD"
            printf '::add-mask::%s\n' "$SECURITY_TEST_BOOTSTRAP_PASSWORD"
          } || true
          {
            printf 'MIGRATION_DATABASE_URL=postgresql+asyncpg://sourcemind_owner:%s@127.0.0.1:55432/sourcemind_security_test\n' "$SECURITY_TEST_OWNER_PASSWORD"
            printf 'TEST_DATABASE_URL=postgresql+asyncpg://sourcemind_test:%s@127.0.0.1:55432/sourcemind_security_test\n' "$SECURITY_TEST_RUNTIME_PASSWORD"
            printf 'TEST_REDIS_URL=redis://127.0.0.1:56379/15\n'
            printf 'SECURITY_TEST_ALLOW_DISPOSABLE=1\n'
          } >> "$GITHUB_ENV"

      # Fail before provisioning if anything is missing, empty, or points
      # somewhere other than the disposable tuple. Prints names and lengths
      # only — never a value.
      - name: Preflight — validate configuration
        run: python .github/scripts/check_security_test_contract.py

      # ── Provision ─────────────────────────────────────────────────────────
      # `--wait` blocks on the healthchecks the compose file declares, so no
      # hand-rolled readiness polling is needed. The init wrapper runs inside
      # the container via docker-entrypoint-initdb.d and receives the owner and
      # runtime passwords as psql variables.
      - name: Start disposable PostgreSQL and Redis
        run: docker compose -f infra/docker-compose.security-test.yml up -d --wait

      # The RLS suite is only meaningful if the runtime role genuinely cannot
      # bypass policies. A superuser or BYPASSRLS role would make every
      # isolation assertion vacuously true, so prove it rather than assume it.
      - name: Assert runtime and owner roles cannot bypass RLS
        run: |
          docker compose -f infra/docker-compose.security-test.yml \
            exec -T postgres-security-test \
            psql -v ON_ERROR_STOP=1 -U sourcemind_bootstrap -d postgres -At -c "
              SELECT CASE
                WHEN count(*) = 2 AND bool_and(NOT rolsuper AND NOT rolbypassrls)
                  THEN 'ok'
                ELSE 'FAIL: expected two non-superuser, non-BYPASSRLS roles'
              END
              FROM pg_roles
              WHERE rolname IN ('sourcemind_owner','sourcemind_test');
            " | grep -qx ok

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Migrate ───────────────────────────────────────────────────────────
      # As the OWNER role. sourcemind_test holds only SELECT/INSERT/UPDATE/
      # DELETE via ALTER DEFAULT PRIVILEGES and has no DDL rights, matching the
      # production role separation the rollout document requires.
      - name: Apply migrations as the migration-owner role
        working-directory: apps/api
        env:
          # MIGRATION_DATABASE_URL is already exported via GITHUB_ENV; aliasing
          # it here keeps the secret out of a workflow-level expression.
          ENVIRONMENT: development
          DEBUG: "false"
          # Migrations do not authenticate anything, but alembic/env.py calls
          # get_settings(), and Settings rejects bypass=false unless CLERK_SECRET_KEY,
          # CLERK_PUBLISHABLE_KEY and CLERK_AUTHORIZED_PARTIES are all present. With
          # "false" here and no Clerk values, alembic died on a ValidationError before
          # reaching the database. The explicit development bypass is the honest fix:
          # this step needs a valid configuration, not an authenticated one.
          #
          # Scoped to THIS step deliberately. It must not reach the acceptance step,
          # which runs with the bypass disabled on purpose.
          AUTH_DEV_BYPASS_ENABLED: "true"
          # 20261005_0010 grants github_author_links explicitly to this role and
          # aborts when the variable is unset (D-021). The role name is not a
          # secret; sourcemind_test is the disposable runtime role.
          SOURCEMIND_RUNTIME_ROLE: sourcemind_test
        run: DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head

      - name: Record applied revision
        run: |
          docker compose -f infra/docker-compose.security-test.yml \
            exec -T postgres-security-test \
            psql -U sourcemind_bootstrap -d sourcemind_security_test -At \
            -c "SELECT 'alembic_version=' || version_num FROM alembic_version"

      # ── Exact selection ───────────────────────────────────────────────────
      # `-o addopts=''` drops the coverage/strictness defaults from
      # pyproject so the collected count is the raw test count. Asserting the
      # exact node IDs means a rename cannot silently shrink the gate, which a
      # bare count would not catch.
      - name: Verify exact test selection (213 nodes)
        working-directory: apps/api
        # SECURITY_TEST_ALLOW_DISPOSABLE / TEST_DATABASE_URL / TEST_REDIS_URL
