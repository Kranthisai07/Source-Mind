          tests/integration/test_attribution_history_real_db.py::test_legacy_chain_with_restarted_positions_is_scored_chronologically
          tests/integration/test_attribution_history_real_db.py::test_merged_snapshot_is_preserved_by_unchanged_and_tags_only_updates
