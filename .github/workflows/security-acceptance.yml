      # ── Acceptance ────────────────────────────────────────────────────────
      # 8 minutes (was 3 before the ingestion race and revision suites), on execution only. Provisioning, pip install and migration
      # sit deliberately outside the budget so a slow dependency resolve is
      # never reported as an acceptance timeout.
      #
      # A JUnit report is emitted so the next step can prove the tests RAN.
      # `pytest` exits 0 on "213 skipped", and every one of these is guarded by
      # the disposable-DB check — so a silent skip is the realistic failure and
      # exit status alone cannot detect it.
      - name: Security acceptance tests
        id: acceptance
        timeout-minutes: 8
        working-directory: apps/api
        env:
          # Disposable URLs come from GITHUB_ENV, not from an expression.
          ENVIRONMENT: development
          DEBUG: "false"
          AUTH_DEV_BYPASS_ENABLED: "false"
        run: |
          python -m pytest -o addopts='' -q -p no:cacheprovider \
            --junitxml=acceptance-results.xml \
            tests/integration/test_attribution_history_real_db.py \
            tests/integration/test_security_foundation_real_db.py \
            tests/integration/test_security_acceptance_real_services.py \
            tests/integration/test_handoff_assignment_real_db.py \
            tests/integration/test_ingestion_worker_contract.py \
            tests/integration/test_pilot_evidence_real_db.py \
            tests/integration/test_pilot_export_real_db.py::test_pilot_export_excludes_other_workspace_rows_real_postgres \
            tests/integration/test_backend_review_real_services.py \
            tests/integration/test_github_author_links_real_db.py \
            tests/integration/test_ingest_authz_real_db.py \
            tests/integration/test_extraction_budget_real_db.py \
            tests/integration/test_publication_concurrency_diagnostics_real_db.py \
            tests/integration/test_sync_task_orm_real_db.py \
            tests/integration/test_ingestion_journey_real_db.py \
            tests/integration/test_connectors_api_real_db.py \
            tests/integration/test_connector_sync_real_db.py \
            tests/integration/test_revision_publication_real_db.py \
            tests/integration/test_source_retirement_real_db.py \
            tests/integration/test_ingest_schema_real_db.py \
            tests/integration/test_source_provenance_real_db.py \
            tests/integration/test_severity_real_path.py::test_an_updates_verdict_keeps_the_disputed_memory_searchable \
            tests/integration/test_severity_real_path.py::test_clustering_keeps_update_targets_visible_across_runs

      - name: Assert all 213 tests executed and passed
        if: always() && steps.acceptance.outcome != 'skipped'
        working-directory: apps/api
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("acceptance-results.xml")
          if not report.exists():
              print("::error::no JUnit report — the acceptance step did not run")
              sys.exit(1)
          suite = ET.parse(report).getroot()
          cases = suite.iter("testcase")
          total = passed = 0
          bad = []
          for c in cases:
              total += 1
              node = f"{c.get('classname')}::{c.get('name')}"
              state = next(
                  (k.tag for k in c
                   if k.tag in {"skipped", "failure", "error"}),
                  "passed",
              )
              if state == "passed":
                  passed += 1
              else:
                  bad.append(f"{node} -> {state}")
          print(f"executed {total}, passed {passed}")
          if total != 213:
              print(f"::error::expected 213 test cases, report contains {total}")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(0 if (total == 213 and passed == 213) else 1)
          PY

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-acceptance-results
          path: apps/api/acceptance-results.xml
          if-no-files-found: ignore

      # ── Cleanup ───────────────────────────────────────────────────────────
      # `always()` so a failed or timed-out acceptance step still tears down.
      # Scoped to this compose project only — it names the project file, so it
      # cannot touch the developer's WSL services or anything else on the host.
      - name: Tear down disposable services
        if: always()
        run: docker compose -f infra/docker-compose.security-test.yml down -v --remove-orphans
