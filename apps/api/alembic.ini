# Alembic configuration for SourceMind
# https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template for new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# Max length of slug portion in filenames
truncate_slug_length = 40

# sys.path modification
prepend_sys_path = .

# Version table name (default is alembic_version)
version_table = alembic_version

# DSN is loaded from environment in env.py — not set here
sqlalchemy.url =

[post_write_hooks]
# Run Black on newly generated migration files
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --line-length 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
