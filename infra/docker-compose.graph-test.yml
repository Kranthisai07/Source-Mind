# Disposable Neo4j + Redpanda for the graph projection integration tests (local and CI).
# Same discipline as docker-compose.security-test.yml: loopback-only ports, tmpfs storage,
# secrets from the environment, fixed non-default ports (the tests refuse anything else).
#
#   GRAPH_TEST_NEO4J_PASSWORD=... docker compose -f infra/docker-compose.graph-test.yml up -d --wait
#
# The images match infra/docker-compose.yml (the development stack) on purpose.
services:
  neo4j-graph-test:
    image: neo4j:5.26.24-community
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_TEST_NEO4J_PASSWORD:?set GRAPH_TEST_NEO4J_PASSWORD}
      GRAPH_TEST_NEO4J_PASSWORD: ${GRAPH_TEST_NEO4J_PASSWORD}
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:57687:7687"
    tmpfs:
      - /data
      - /logs
    healthcheck:
      # Proves Bolt and authentication, not just that the HTTP port answers.
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$$GRAPH_TEST_NEO4J_PASSWORD" "RETURN 1" || exit 1
      interval: 5s
      timeout: 10s
      retries: 30

  redpanda-graph-test:
    image: redpandadata/redpanda:v24.3.14
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --mode=dev-container
      - --kafka-addr=PLAINTEXT://0.0.0.0:59092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:59092
    ports:
      - "127.0.0.1:59092:59092"
    tmpfs:
      - /var/lib/redpanda/data:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:59092 | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
