services:
  postgres-security-test:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: sourcemind_bootstrap
      POSTGRES_PASSWORD: ${SECURITY_TEST_BOOTSTRAP_PASSWORD:?set in the CI secret store}
      POSTGRES_DB: postgres
      SECURITY_TEST_OWNER_PASSWORD: ${SECURITY_TEST_OWNER_PASSWORD:?set in the CI secret store}
      SECURITY_TEST_RUNTIME_PASSWORD: ${SECURITY_TEST_RUNTIME_PASSWORD:?set in the CI secret store}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres/security-test-init.sh:/docker-entrypoint-initdb.d/01-security-test.sh:ro
      - ./postgres/security-test-init.sql:/docker-entrypoint-initdb.d/02-security-test.sql.in:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcemind_bootstrap -d sourcemind_security_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-security-test:
    image: redis:7.0.15-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
